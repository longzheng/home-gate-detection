[package]
name = "home-gate-detection"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["now"] }
digest_auth = "0.3"
dotenvy = "0.15"
fast_image_resize = "5.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "api-24", "download-binaries", "copy-dylibs", "tls-rustls"] }
percent-encoding = "2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rumqttc = { version = "0.25", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
